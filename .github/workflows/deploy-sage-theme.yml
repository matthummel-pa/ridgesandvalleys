name: Deploy Sage theme (SiteGround)

on:
  push:
    branches: [main]
    paths:
      - "web/app/themes/ridgesandvalleys-theme/**"
      - ".github/workflows/deploy-sage-theme.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: "8.3"
      - run: php -v
