name: Deploy Sage theme (SiteGround)

# Builds the Sage theme and rsyncs it to the live theme folder over SSH.
# Deploys CODE ONLY -- never the database or uploads. Content is never touched.
#
# PHP is installed via apt instead of shivammathur/setup-php. That third-party
# action now fails the workflow at startup (no jobs) — confirmed 14 Aug 2026.
on:
  push:
    branches: [main]
    paths:
      - "web/app/themes/ridgesandvalleys-theme/**"
      - ".github/workflows/deploy-sage-theme.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install PHP and Composer
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y php-cli php-xml php-mbstring php-curl php-zip unzip
          php -v
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/app/themes/ridgesandvalleys-theme/package-lock.json

      - name: Build theme (Acorn + Vite)
        working-directory: web/app/themes/ridgesandvalleys-theme
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          npm ci
          npm run build

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          host="${{ secrets.SSH_HOST }}"
          port="${{ secrets.SSH_PORT }}"
          ok=0
          for i in 1 2 3 4 5 6; do
            if ssh-keyscan -T 15 -p "$port" "$host" >> ~/.ssh/known_hosts 2>/dev/null; then
              ok=1
              break
            fi
            sleep $((i * 3))
          done
          if [ "$ok" -ne 1 ]; then
            echo "ssh-keyscan failed after retries"
            exit 1
          fi

      - name: Deploy theme via rsync
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".dev-wp" \
            --exclude "dev" \
            --exclude "concept" \
            --exclude "docs" \
            --exclude "resources/css" \
            --exclude "resources/js" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "vite.config.js" \
            --exclude "tsconfig.json" \
            --exclude "eslint.config.js" \
            --exclude ".wp-env.json" \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            web/app/themes/ridgesandvalleys-theme/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Clear Acorn view cache + flush WordPress + SiteGround cache
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd ~/www/ridgesandvalleys.com/public_html && wp acorn view:clear; wp acorn optimize:clear; wp cache flush; wp sg purge" || true
