name: Publish concept repos

# Copies each Work-page concept into its named GitHub repo (`{folder}-theme`)
# and pushes to main. Those repos serve GitHub Pages from the branch root
# (no dest-repo Actions workflow, so the PAT does not need Workflows write).
#
# This file must live on the default branch or GitHub will not show
# Actions → Publish concept repos → Run workflow.
#
# Secret CONCEPT_REPOS_TOKEN: fine-grained PAT, resource owner matthummel-pa,
# only the ten *-theme repos, permissions:
#   Contents: Read and write
#   Pages: Read and write
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/app/themes/ridgesandvalleys-theme/concept/**"
      - "scripts/publish-concept-repos.sh"
      - "scripts/concept-repos.tsv"
      - ".github/workflows/publish-concept-repos.yml"

permissions:
  contents: read

jobs:
  stage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage all ten concept repos (no push)
        run: |
          chmod +x scripts/publish-concept-repos.sh
          ./scripts/publish-concept-repos.sh --stage-only
          test -f .concept-repo-stage/gettysburg-hotel-theme/index.html
          test -f .concept-repo-stage/gettysburg-hotel-theme/.nojekyll
          test ! -e .concept-repo-stage/gettysburg-hotel-theme/.github/workflows/deploy-pages.yml
          ! grep -R --include='*.html' -q 'example-concept.test' .concept-repo-stage

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish each concept to its named repo
        env:
          CONCEPT_REPOS_TOKEN: ${{ secrets.CONCEPT_REPOS_TOKEN }}
          GH_TOKEN: ${{ secrets.CONCEPT_REPOS_TOKEN }}
        run: |
          if [ -z "${CONCEPT_REPOS_TOKEN}" ]; then
            echo "::error::Missing secret CONCEPT_REPOS_TOKEN"
            echo "GitHub → Settings → Developer settings → Fine-grained tokens → Generate:"
            echo "  Resource owner: matthummel-pa"
            echo "  Repository access: only the ten *-theme concept repos"
            echo "  Permissions: Contents (read/write), Pages (read/write)"
            echo "Then: this repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "  Name: CONCEPT_REPOS_TOKEN"
            echo "  Value: the PAT"
            echo "Re-run Actions → Publish concept repos."
            exit 1
          fi
          chmod +x scripts/publish-concept-repos.sh
          ./scripts/publish-concept-repos.sh
