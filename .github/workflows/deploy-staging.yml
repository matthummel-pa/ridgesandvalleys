name: Deploy Bedrock to STAGING (subdomain)

# Builds the FULL Bedrock site (WP core + Composer plugins + built Sage theme)
# and rsyncs it to the staging subdomain's Bedrock root over SSH.
# NEVER touches the server's .env or uploads. Manual trigger only --
# staging is a disposable proof environment.
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/app/themes/ridgesandvalleys-theme/package-lock.json

      - name: Build full Bedrock (Composer -- WP core + plugins)
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Build Sage theme (Acorn + Vite)
        working-directory: web/app/themes/ridgesandvalleys-theme
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          npm ci
          npm run build

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy Bedrock via rsync (code only -- never .env or uploads)
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".ddev" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude "web/app/uploads" \
            --exclude "web/app/cache" \
            --exclude "web/app/upgrade" \
            --exclude "node_modules" \
            --exclude "web/app/themes/ridgesandvalleys-theme/node_modules" \
            --exclude "web/app/themes/ridgesandvalleys-theme/resources/css" \
            --exclude "web/app/themes/ridgesandvalleys-theme/resources/js" \
            --exclude "web/app/themes/ridgesandvalleys-theme/.dev-wp" \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            ./ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.STAGING_PATH }}/"

      - name: Flush caches on staging (best effort)
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ secrets.STAGING_PATH }}/web && wp cache flush 2>/dev/null" || true
