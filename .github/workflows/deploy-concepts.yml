name: Deploy concept demos to GitHub Pages

# Publishes web/app/themes/ridgesandvalleys-theme/concept/ as a static site.
# Live URL: https://matthummel-pa.github.io/ridgesandvalleys/
#
# First-time setup (once): GitHub → Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "web/app/themes/ridgesandvalleys-theme/concept/**"
      - ".github/workflows/deploy-concepts.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          rsync -a web/app/themes/ridgesandvalleys-theme/concept/ _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
